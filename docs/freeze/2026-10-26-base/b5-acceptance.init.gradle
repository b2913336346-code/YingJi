allprojects { p -> p.plugins.withId('com.android.application') {
 def a=p.extensions.getByName('android')
 a.buildTypes.create('b5PosterAcceptance') {
  initWith(a.buildTypes.getByName('debug')); applicationIdSuffix='.b5poster.acceptance'
  matchingFallbacks=['debug']; signingConfig=a.signingConfigs.getByName('debug')
 }
 a.sourceSets.getByName('b5PosterAcceptance').java.srcDir('src/debug/java')
 a.sourceSets.getByName('b5PosterAcceptance').res.srcDir('src/debug/res')
 a.sourceSets.getByName('b5PosterAcceptance').manifest.srcFile('build/b5-poster-boundary/AndroidManifest.xml')
 a.testBuildType='b5PosterAcceptance'
 p.configurations.configureEach { c -> if(c.name=='b5PosterAcceptanceImplementation') c.extendsFrom(p.configurations.getByName('debugImplementation')) }
} }
